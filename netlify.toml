# Netlify configuration — single site: static React app + serverless API functions

[build]
  command = "npm install --prefix web && npm run build --prefix web"
  publish = "web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev --prefix web"
  targetPort = 5173
  port = 8888
