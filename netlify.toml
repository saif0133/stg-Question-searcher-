# =========================================================
# Netlify configuration (single deployment)
#
# - Static React app is served from web/dist
# - The API lives in serverless functions under netlify/functions
# - /api/* is rewritten to those functions
# - Everything else falls back to index.html
# =========================================================

[build]
  command = "npm install --prefix web && npm run build --prefix web"
  publish = "web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev --prefix web"
  framework = "vite"
  targetPort = 5173
  port = 8888